<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123B5D">
<title>Infecto Consult</title>

<style>
:root{
  --navy:#123b5d;
  --blue:#287aa8;
  --bg:#f5f7f9;
  --card:#fff;
  --text:#1d2730;
  --muted:#65727e;
  --line:#dce3e8
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px/1.58 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:0 16px 50px
}

header{
  background:linear-gradient(135deg,#0d304a,#287aa8);
  color:#fff;
  padding:18px 0 20px
}

.top{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between
}

.brand{
  font-size:20px;
  font-weight:800
}

.back{
  color:#fff;
  text-decoration:none;
  border:1px solid #ffffff55;
  border-radius:999px;
  padding:7px 12px;
  font-size:13px
}

.title{
  display:flex;
  align-items:center;
  gap:12px;
  margin:18px 0 5px
}

.icon{
  font-size:30px
}

.title h1{
  font-size:25px;
  line-height:1.15;
  margin:0
}

.meta{
  font-size:12px;
  opacity:.88
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  padding:10px 0;
  position:sticky;
  top:0;
  background:rgba(245,247,249,.96);
  z-index:5;
  border-bottom:1px solid var(--line)
}

.tab{
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:8px 13px;
  white-space:nowrap;
  cursor:pointer;
  color:var(--navy);
  font-weight:650
}

.tab.active{
  background:var(--navy);
  color:#fff;
  border-color:var(--navy)
}

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:22px;
  margin-top:16px;
  box-shadow:0 2px 8px #00000008
}

.panel h2{
  color:var(--navy);
  font-size:22px;
  margin:0 0 16px
}

.panel h3{
  color:#244e68;
  margin-top:25px
}

.panel h4{
  margin-top:20px;
  color:#315d73
}

.panel p{
  margin:8px 0
}

.panel ul{
  padding-left:24px
}

.panel li{
  margin:4px 0
}

.panel a{
  color:#126c9b
}

.panel blockquote{
  margin:16px 0;
  padding:12px 16px;
  border-left:4px solid var(--blue);
  background:#eef6fa
}

.callout{
  display:flex;
  gap:12px;
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#f8fbfc;
  margin:14px 0
}

.callout-icon{
  font-size:21px
}

.table-wrap{
  overflow:auto;
  margin:15px 0
}

.table-wrap table{
  border-collapse:collapse;
  width:100%;
  min-width:620px
}

.table-wrap th,
.table-wrap td{
  border:1px solid var(--line);
  padding:9px;
  vertical-align:top;
  text-align:left
}

.table-wrap th{
  background:#eef3f6
}

.columns{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:14px
}

.column{
  min-width:0
}

.media,
.external-embed,
.file-link{
  padding:12px;
  border:1px dashed var(--line);
  border-radius:9px;
  background:#fafcfd
}

.media a,
.external-embed a{
  font-weight:700
}

.panel img{
  max-width:100%;
  height:auto;
  border-radius:8px
}

.panel figure{
  margin:16px 0
}

.panel figcaption{
  font-size:12px;
  color:var(--muted)
}

details{
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px 12px;
  margin:10px 0
}

summary{
  cursor:pointer;
  font-weight:650
}

.spacer{
  height:5px
}

.todo{
  display:block;
  margin:7px 0
}

.todo input{
  margin-right:8px
}

.equation,
pre{
  background:#f3f5f7;
  padding:10px;
  border-radius:8px;
  overflow:auto
}

.miniapp{
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  background:#fff
}

.miniapp iframe{
  width:100%;
  min-height:760px;
  border:0;
  display:block
}

.notice{
  padding:14px;
  border-radius:10px;
  background:#fff8e8;
  border:1px solid #f0d69a
}

.footer{
  color:var(--muted);
  font-size:12px;
  margin-top:18px
}


/* ============================================================
 * IMAGENS CLÍNICAS — thumbnail + modal
 * ============================================================ */

.clinical-image-card{
  display:inline-flex;
  flex-direction:column;
  align-items:stretch;
  width:min(290px,100%);
  margin:14px 0;
  padding:5px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  box-shadow:0 2px 7px #0000000a;
  cursor:zoom-in;
  transition:box-shadow .15s ease, transform .15s ease;
}

.clinical-image-card:hover{
  box-shadow:0 5px 16px #00000016;
  transform:translateY(-1px);
}

.clinical-image-card img{
  display:block;
  width:100%;
  max-width:100%;
  height:175px;
  object-fit:contain;
  border-radius:6px;
  background:#f6f8fa;
  cursor:zoom-in;
}

.clinical-image-action{
  display:block;
  padding:5px 4px 1px;
  color:var(--blue);
  font-size:12px;
  font-weight:700;
  text-align:center;
}

.clinical-image-caption{
  display:block;
  padding:4px 4px 1px;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
  text-align:center;
}

.clinical-image-modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(8,20,30,.82);
  z-index:1000;
}

.clinical-image-modal.open{
  display:flex;
}

.clinical-image-modal-inner{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  max-width:96vw;
  max-height:94vh;
}

.clinical-image-modal img{
  display:block;
  max-width:92vw;
  max-height:82vh;
  width:auto;
  height:auto;
  object-fit:contain;
  border-radius:8px;
  background:#fff;
  box-shadow:0 10px 40px #00000055;
}

.clinical-image-modal-caption{
  max-width:90vw;
  margin-top:10px;
  color:#fff;
  font-size:13px;
  line-height:1.45;
  text-align:center;
}

.clinical-image-close{
  position:fixed;
  top:max(10px, env(safe-area-inset-top));
  right:max(10px, env(safe-area-inset-right));
  z-index:100002;
  width:52px;
  height:52px;
  padding:0;
  border:2px solid #fff;
  border-radius:50%;
  background:#fff;
  color:#123b5d;
  font-size:32px;
  font-weight:800;
  line-height:46px;
  text-align:center;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  box-shadow:0 4px 18px #00000055;
}


/* ============================================================
 * ELEMENTOS ADMINISTRATIVOS — não exibir ao assinante
 * ============================================================ */

/* O arquivo HTML anexado ao Notion é usado como MiniApp,
   portanto o anexo bruto não deve aparecer na interface. */
.file-link{
  display:none !important;
}

@media(max-width:700px){
  .clinical-image-card{
    width:290px;
    max-width:100%;
  }

  .clinical-image-card img{
    height:165px;
  }

  .clinical-image-modal{
    padding:12px;
  }

  .clinical-image-modal img{
    max-width:96vw;
    max-height:78vh;
  }

  .clinical-image-close{
    top:max(8px, env(safe-area-inset-top));
    right:max(8px, env(safe-area-inset-right));
    width:52px;
    height:52px;
    font-size:32px;
    line-height:46px;
  }
}

@media(max-width:700px){

  .wrap{
    padding:0 10px 35px
  }

  .title h1{
    font-size:21px
  }

  .panel{
    padding:15px
  }

  .miniapp iframe{
    min-height:900px
  }
}
</style>
</head>

<body>

<header>
  <div class="wrap">

    <div class="top">

      <div class="brand">
        🧬 Infecto Consult
      </div>

      <a class="back" href="index.html">
        ← Conteúdos
      </a>

    </div>

    <div class="title">

      <div class="icon" id="icon">
        🧬
      </div>

      <div>

        <h1 id="title">
          Carregando…
        </h1>

        <div class="meta" id="meta"></div>

      </div>

    </div>

  </div>
</header>


<main class="wrap">

  <div class="tabs" id="tabs"></div>

  <div id="decisor"></div>

  <div id="content"></div>

  <div class="footer" id="footer"></div>

</main>


<script>

/*
 * ============================================================
 * UTILITÁRIO DE ESCAPE
 * ============================================================
 */

const esc = s =>
  String(s ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  )


/*
 * ============================================================
 * ID DA PÁGINA
 * ============================================================
 */

const params =
  new URLSearchParams(location.search)

const id =
  params.get('id')


let data


/*
 * ============================================================
 * MINIAPPS
 * ============================================================
 *
 * O PWA NÃO precisa mais saber:
 *
 * Pneumonia → pneumonia.html
 * PSI → pneumonia.html
 * CURB-65 → pneumonia.html
 *
 * O Notion informa automaticamente quais arquivos HTML
 * estão anexados à página.
 */


/*
 * Cria o conteúdo da aba "Decisor clínico"
 */

function miniHtml(){

  /*
   * Novo sistema:
   *
   * data.miniAppFiles =
   * [
   *   {
   *     id: "...",
   *     name: "pneumonia_decisor.html",
   *     url: "/api/miniapp?blockId=..."
   *   }
   * ]
   */

  const apps =
    Array.isArray(data.miniApps)
      ? data.miniApps
      : (Array.isArray(data.miniAppFiles) ? data.miniAppFiles : [])


  /*
   * Nenhum HTML encontrado na página do Notion.
   */

  if(!apps.length){

    return `
      <div class="notice">

        <strong>Decisor clínico</strong>

        <br>

        Esta página ainda não possui um
        MiniApp HTML anexado no Notion.

        <br><br>

        Para adicionar o decisor, anexe o arquivo
        <strong>.html</strong> diretamente nesta página
        do Notion.

      </div>
    `
  }


  /*
   * Um ou mais MiniApps encontrados.
   */

  return apps
    .map(app => {

      const title =
        app.name ||
        'Decisor clínico'


      const url =
        app.url


      return `
        <div class="miniapp">

          <iframe
            src="${esc(url)}"
            title="${esc(title)}"
            loading="eager">
          </iframe>

        </div>
      `

    })
    .join(
      '<div style="height:14px"></div>'
    )
}


/*
 * ============================================================
 * CONTROLE DAS ABAS
 * ============================================================
 */

function activate(i){

  document
    .querySelectorAll('.tab')
    .forEach((b,j) =>
      b.classList.toggle(
        'active',
        j === i
      )
    )


  document
    .querySelectorAll('.tabpanel')
    .forEach((p,j) =>
      p.style.display =
        j === i
          ? 'block'
          : 'none'
    )
}


/*
 * ============================================================
 * CARREGAMENTO DA PÁGINA
 * ============================================================
 */


/*
 * ============================================================
 * IMAGENS CLÍNICAS
 * ============================================================
 *
 * Converte imagens editoriais em:
 *   thumbnail/card → clique → modal ampliado.
 *
 * O Notion continua sendo o editor. O PWA controla apenas
 * a apresentação para o assinante.
 */

function enhanceClinicalImages(){

  const panels =
    document.querySelectorAll('.tabpanel.panel')

  panels.forEach(panel => {

    /*
     * Remove file-link exibido pelo renderer quando ele
     * estiver associado a uma imagem.
     */
    panel
      .querySelectorAll('.file-link')
      .forEach(link => {

        const previous =
          link.previousElementSibling

        if(
          previous &&
          previous.querySelector &&
          previous.querySelector('img')
        ){
          link.remove()
        }
      })

    panel
      .querySelectorAll('img')
      .forEach(img => {

        if(
          img.closest('.miniapp') ||
          img.closest('.clinical-image-card')
        ){
          return
        }

        /*
         * Captura a legenda original antes de transformar
         * a imagem em card.
         */
        const figure =
          img.closest('figure')

        const originalCaption =
          figure?.querySelector('figcaption')

        const captionText =
          originalCaption
            ? originalCaption.textContent.trim()
            : (
                img.getAttribute('data-caption') ||
                ''
              )

        const card =
          document.createElement('div')

        card.className =
          'clinical-image-card'

        card.setAttribute('role','button')
        card.setAttribute('tabindex','0')
        card.setAttribute(
          'aria-label',
          'Ampliar imagem clínica'
        )

        const parent =
          img.parentElement

        if(parent && parent.tagName === 'A'){
          parent.replaceWith(card)
          card.appendChild(img)
        }else{
          img.replaceWith(card)
          card.appendChild(img)
        }

        /*
         * A legenda do Notion não fica mais solta
         * embaixo do card. Ela pode aparecer apenas
         * no modal, mantendo a página limpa.
         */
        if(originalCaption){
          originalCaption.remove()
        }

        const action =
          document.createElement('span')

        action.className =
          'clinical-image-action'

        action.textContent =
          '🔍 Ampliar imagem'

        card.appendChild(action)

        const open =
          () => openClinicalImage(
            img.src,
            captionText || img.alt || ''
          )

        card.addEventListener('click', open)

        card.addEventListener(
          'keydown',
          e => {

            if(
              e.key === 'Enter' ||
              e.key === ' '
            ){

              e.preventDefault()
              open()
            }
          }
        )
      })
  })
}

function openClinicalImage(
  src,
  caption = ''
){

  const modal =
    document.getElementById(
      'clinicalImageModal'
    )

  const image =
    document.getElementById(
      'clinicalImageModalImg'
    )

  const captionEl =
    document.getElementById(
      'clinicalImageModalCaption'
    )

  image.src = src
  image.alt = caption || 'Imagem clínica'

  captionEl.textContent =
    caption

  modal.classList.add('open')

  modal.setAttribute(
    'aria-hidden',
    'false'
  )

  document.body.style.overflow =
    'hidden'
}


function closeClinicalImage(){

  const modal =
    document.getElementById(
      'clinicalImageModal'
    )

  const image =
    document.getElementById(
      'clinicalImageModalImg'
    )

  modal.classList.remove('open')

  modal.setAttribute(
    'aria-hidden',
    'true'
  )

  image.src = ''

  document.body.style.overflow =
    ''
}


/* Fechar pelo botão — compatível com toque Android/Xiaomi */
const clinicalImageCloseButton =
  document.getElementById('clinicalImageClose')

if(clinicalImageCloseButton){

  const closeByTouch = e => {
    e.preventDefault()
    e.stopPropagation()
    closeClinicalImage()
  }

  clinicalImageCloseButton.addEventListener(
    'pointerup',
    closeByTouch
  )

  clinicalImageCloseButton.addEventListener(
    'click',
    closeByTouch
  )
}


/* Tocar na área escura fecha; tocar na imagem não fecha */
const clinicalImageModal =
  document.getElementById('clinicalImageModal')

clinicalImageModal?.addEventListener(
  'pointerup',
  e => {
    if(e.target === clinicalImageModal){
      closeClinicalImage()
    }
  }
)


/* Fechar com ESC */
document.addEventListener(
  'keydown',
  e => {

    if(e.key === 'Escape'){
      closeClinicalImage()
    }
  }
)


/* Botão/gesto Voltar do Android também fecha a imagem */
let clinicalImageOpenInHistory = false

const _openClinicalImage = openClinicalImage
openClinicalImage = function(src, caption = ''){

  _openClinicalImage(src, caption)

  if(!clinicalImageOpenInHistory){
    history.pushState(
      {clinicalImageModal:true},
      '',
      location.href
    )
    clinicalImageOpenInHistory = true
  }
}

const _closeClinicalImage = closeClinicalImage
closeClinicalImage = function(){

  _closeClinicalImage()

  if(clinicalImageOpenInHistory){
    clinicalImageOpenInHistory = false

    if(history.state?.clinicalImageModal){
      history.back()
    }
  }
}

window.addEventListener(
  'popstate',
  () => {

    const modal =
      document.getElementById('clinicalImageModal')

    if(
      modal &&
      modal.classList.contains('open')
    ){

      modal.classList.remove('open')
      modal.setAttribute('aria-hidden','true')

      const image =
        document.getElementById(
          'clinicalImageModalImg'
        )

      if(image){
        image.src = ''
      }

      document.body.style.overflow = ''
      clinicalImageOpenInHistory = false
    }
  }
)


async function load(){

  if(!id){

    document.getElementById('content').innerHTML =
      '<div class="notice">Página não informada.</div>'

    return
  }


  try{

    /*
     * Busca conteúdo clínico + MiniApps no Notion.
     */

    const r =
      await fetch(
        '/api/page?id=' +
        encodeURIComponent(id)
      )


    data =
      await r.json()


    if(!r.ok){

      throw new Error(
        data.error ||
        'Erro'
      )
    }


    /*
     * ========================================================
     * CABEÇALHO
     * ========================================================
     */

    document.title =
      data.title +
      ' — Infecto Consult'


    document.getElementById('icon')
      .textContent =
        data.icon || '🧬'


    document.getElementById('title')
      .textContent =
        data.title


    document.getElementById('meta')
      .textContent =
        (data.category || '') +
        (data.premium
          ? ' · Premium'
          : '')


    /*
     * ========================================================
     * ABAS
     * ========================================================
     *
     * A primeira aba é sempre:
     *
     * ⚡ Decisor clínico
     *
     * Depois vêm as abas editoriais do Notion.
     */

    /*
     * Ordem das abas:
     * 1. ⚡ Decisor clínico
     * 2. 📖 Visão geral
     * 3. Demais abas editoriais do Notion
     */

    const editorialTabs = Array.isArray(data.tabs)
      ? data.tabs
      : []

    const fullHtml =
      typeof data.fullHtml === 'string' &&
      data.fullHtml.trim()
        ? data.fullHtml
        : ''

    const overviewHtml =
      fullHtml ||
      editorialTabs
        .map(t => t?.html || '')
        .join('')

    const tabs = [

      {
        label:'⚡ Decisor clínico',
        special:true
      },

      {
        label:'📖 Visão geral',
        special:false,
        overview:true
      },

      ...editorialTabs
        .filter(t =>
          t &&
          t.label &&
          !/^visão geral$/i.test(String(t.label).trim())
        )

    ]


    document.getElementById('tabs')
      .innerHTML =

        tabs
          .map(
            (t,i) =>
              `
                <button
                  class="tab"
                  onclick="activate(${i})"
                >
                  ${esc(t.label)}
                </button>
              `
          )
          .join('')


    /*
     * ========================================================
     * PAINEL DO DECISOR
     * ========================================================
     */

    document.getElementById('decisor')
      .innerHTML =

        `
          <div
            class="tabpanel panel"
            style="display:none"
          >

            <h2>
              Decisor clínico
            </h2>

            ${miniHtml()}

          </div>
        `


    /*
     * ========================================================
     * CONTEÚDO EDITORIAL
     * ========================================================
     */

    /*
     * Visão geral usa fullHtml quando disponível.
     * Fallback: concatena as abas editoriais recebidas.
     */
    const overviewPanel = `
      <section
        class="tabpanel panel"
        style="display:none"
      >

        <h2>📖 Visão geral</h2>

        ${
          overviewHtml ||
          '<div class="notice">Esta página ainda não possui conteúdo editorial disponível.</div>'
        }

      </section>
    `

    const extraPanels =
      editorialTabs
        .filter(t =>
          t &&
          t.label &&
          !/^visão geral$/i.test(String(t.label).trim())
        )
        .map(
          t =>
            `
              <section
                class="tabpanel panel"
                style="display:none"
              >

                <h2>
                  ${esc(t.label)}
                </h2>

                ${t.html || ''}

              </section>
            `
        )
        .join('')

    document.getElementById('content').innerHTML =
      overviewPanel +
      extraPanels

    /*
     * Converte imagens editoriais em thumbnails clicáveis
     * com abertura em modal.
     */
    enhanceClinicalImages()


    /*
     * ========================================================
     * RODAPÉ
     * ========================================================
     */

    /*
     * O Notion é apenas o CMS/editor interno.
     * Não exibir a origem editorial para o assinante.
     */
    document.getElementById('footer').innerHTML = ''


    /*
     * ========================================================
     * ABA INICIAL
     * ========================================================
     *
     * Se houver MiniApp:
     *
     *     abre Decisor clínico
     *
     * Se não houver MiniApp:
     *
     *     abre a primeira aba clínica.
     *
     * Isso evita deixar uma aba inexistente selecionada.
     */

    const hasMiniApps =
      (Array.isArray(data.miniApps) && data.miniApps.length > 0) ||
      (Array.isArray(data.miniAppFiles) && data.miniAppFiles.length > 0)


    if(hasMiniApps){

      activate(0)

    }else{

      activate(1)

    }


  }catch(e){

    document.getElementById('content')
      .innerHTML =

        `
          <div class="notice">

            <strong>
              Não foi possível carregar o conteúdo.
            </strong>

            <br>

            ${esc(e.message)}

          </div>
        `
  }
}
